schema_version: 1.0.0
form:
  id: survey
  version: '2026.1'
references:
- stations
sheets:
  Metadata:
    layout: {kind: cells, column_count: 3, row_count: 5}
    fields:
      submission: {mandatory: true, location: C2, type: string, pattern: '^[0-9]{3}$'}
      date: {mandatory: true, location: C3, type: date}
      comment: {location: C5, type: string, default: null}
  Observations:
    layout: {kind: table, column_count: 6, start_row: 6}
    fields:
      station: {mandatory: true, type: string, reference: stations}
      count: {mandatory: true, type: integer, minimum: 0, maximum: 1000}
      length: {type: number, minimum: 0}
      unit: {type: string, enum: [cm, m], required_field: length}
      active: {mandatory: true, type: boolean, default: false}
      observed_at: {type: datetime}
